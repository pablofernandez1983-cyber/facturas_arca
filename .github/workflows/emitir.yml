name: Emitir Facturas ARCA

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Qué emitir'
        required: true
        default: 'AMBOS'
        type: choice
        options:
          - AMBOS
          - MAMA
          - PAPA
      ids:
        description: 'IDs de Supabase a emitir (coma separados). Vacío = todos los pendientes del mes.'
        required: false
        default: ''

concurrency:
  group: emitir-arca
  cancel-in-progress: false   # no cancelar si ya hay uno corriendo

jobs:
  emitir:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Verificar secrets
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "SUPABASE_URL primeros 20 chars: ${SUPABASE_URL:0:20}"
          echo "SUPABASE_SERVICE_KEY set: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}"

      - name: Limpiar log anterior y avisar inicio
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          curl -s -X DELETE "$SUPABASE_URL/rest/v1/workflow_log?id=gte.0" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" > /dev/null
          curl -s -X POST "$SUPABASE_URL/rest/v1/workflow_log" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"mensaje": "🚀 Preparando entorno (instalando dependencias, ~1-2 min)..."}' > /dev/null

      - name: Instalar dependencias
        run: |
          pip install -r requirements-playwright.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Emitir MAMA
        if: ${{ inputs.tipo == 'MAMA' || inputs.tipo == 'AMBOS' }}
        env:
          ARCA_CUIT_MAMA:       ${{ secrets.ARCA_CUIT_MAMA }}
          ARCA_CLAVE_MAMA:      ${{ secrets.ARCA_CLAVE_MAMA }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/emitir_MAMA.py --ids "${{ inputs.ids }}"

      - name: Emitir PAPA
        if: ${{ inputs.tipo == 'PAPA' || inputs.tipo == 'AMBOS' }}
        env:
          ARCA_CUIT_MAMA:       ${{ secrets.ARCA_CUIT_MAMA }}
          ARCA_CLAVE_MAMA:      ${{ secrets.ARCA_CLAVE_MAMA }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/emitir_PAPA.py --ids "${{ inputs.ids }}"

      - name: Enviar PDFs por email
        if: always()
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/send_email.py

      - name: Subir screenshots de debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-debug
          path: /tmp/screenshots/
          if-no-files-found: ignore
          retention-days: 3
